<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Encodes the path into a query param so index.html can restore it
      const pathSegmentsToKeep =
        /\.github\.io$/i.test(location.hostname) || /^\/EvMod(?:\/|$)/.test(location.pathname)
          ? 1
          : 0;
      location.replace(
        location.origin +
        location.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        location.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replaceAll('&', '~and~') +
        (location.search ? '&' + location.search.slice(1).replaceAll('&', '~and~') : '') +
        location.hash
      );
    </script>
  </head>
  <body></body>
</html>
