<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvMod Tools</title>
    <meta name="description" content="Minecraft map tools — convert .dat/.cache/.nbt/.litematic/.schem files and extract map hashes" />
    <link rel="icon" href="%BASE_URL%favicon.png" type="image/png" />

    <meta property="og:title" content="EvMod Tools" />
    <meta property="og:description" content="Convert map-related files and extract map hashes" />
    <meta property="og:type" content="website" />
    <!-- GitHub Pages SPA redirect restore -->
    <script>
      (() => {
        const base = "%BASE_URL%";
        const { pathname, search, hash } = location;
        if (base !== "/" && pathname !== base.slice(0, -1) && !pathname.startsWith(base)) return;

        // Restore the 404 fallback's encoded route/query before canonicalizing its path.
        const redirected = search.startsWith("?/");
        const restored = redirected
          ? pathname.replace(/\/+$/, "") + search.slice(1).split("&").map(s => s.replaceAll("~and~", "&")).join("?")
          : pathname + search;
        const queryStart = restored.indexOf("?");
        const path = (queryStart < 0 ? restored : restored.slice(0, queryStart))
          .replace(/\/index\.html\/*$/i, "/")
          .replace(/\/+$/, "");
        const query = queryStart < 0 ? "" : restored.slice(queryStart);
        const canonical = path + (path.split("/").at(-1).includes(".") ? "" : "/") + query + hash;

        if (redirected) history.replaceState(null, "", canonical);
        else if (canonical !== pathname + search + hash) location.replace(canonical);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
